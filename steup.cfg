[metadata]
name = review_hunter
version = 1.1.1
description-file = README.md
author = Andry Andrianarivelo
description = A local bibliographic review app with DOI metadata and source-tested downloads
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Andrianarivelo/ReviewHunter
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    requests>=2.25.1
    beautifulsoup4>=4.9.3

[options.entry_points]
console_scripts =
    review-hunter = doi_hunter.__main__:main
    review-hunter-web = doi_hunter_web.__main__:main
    doi-hunter = doi_hunter.__main__:main

[options.package_data]
* = *.txt, *.csv

[options.extras_require]
dev =
    pytest
    black
