    <linearGradient id="rh-bg" x1="6" y1="2" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset=".52" stop-color="#0b8bd1"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="rh-shine" cx="18" cy="6" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#rh-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#rh-shine)"/>
  <circle cx="31.5" cy="25.5" r="10.6" fill="#fff" fill-opacity=".16"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M19.5 14.5v35" stroke-width="7"/>
