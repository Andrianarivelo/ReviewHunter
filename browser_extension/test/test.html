<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ReviewHunter Connector: extractor tests</title>
  <style>
    body { font: 13px/1.5 "Segoe UI", system-ui, sans-serif; margin: 24px; color: #0f172a; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    #summary { font-weight: 700; font-size: 15px; padding: 8px 12px; border-radius: 8px; display: inline-block; }
    #summary.pass { background: #dcfce7; color: #166534; }
    #summary.fail { background: #fee2e2; color: #991b1b; }

    li { padding: 2px 0; white-space: pre-wrap; }
    li.fail { color: #b91c1c; font-weight: 700; }
    li.pass { color: #15803d; }
  </style>
</head>
<body>
  <h1>ReviewHunter Connector: extractor tests</h1>

</html>
