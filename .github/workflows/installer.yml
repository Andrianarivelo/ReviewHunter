# Installer tests on clean machines, previous launch method (python run.py) vs the new installer.
#
# Every job starts from a fresh container / runner and writes one JSON result
# (platform, scenario, method, success, seconds, python) uploaded as an artifact; they are
# aggregated by benchmarks/benchmark_installer.py into CSV files and figures.
#
#   scenario "python"  distribution image + python3 only (what a desktop user typically has)
#   scenario "bare"    distribution image with no Python at all (installer only)
name: installer

on:
  push:
    branches: [main]
    paths: ["installer/**", "install.sh", "install.ps1", "Install-ReviewHunter.bat", "Install ReviewHunter.command",
            "requirements.txt", "run.py",
            "doi_hunter/**", "doi_hunter_web/**", "browser_extension/**", "word_addin/**",
            "scripts/**", "tools/**", "pyproject.toml", "setup.py", "MANIFEST.in", ".gitattributes",
            "tests/test_installer*.py", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package current app and Chrome connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installable archives from this commit
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=ReviewHunter/ --output=dist/ReviewHunter.zip HEAD
          git archive --format=zip --output=dist/ReviewHunter-Chrome-Extension.zip HEAD:browser_extension
          cp Install-ReviewHunter.bat install.sh install.ps1 "Install ReviewHunter.command" dist/
      - name: Verify packaged app, extension resources and PDF dependencies
        env:
          RH_RELEASE_ARCHIVE: ${{ github.workspace }}/dist/ReviewHunter.zip
          RH_EXTENSION_ARCHIVE: ${{ github.workspace }}/dist/ReviewHunter-Chrome-Extension.zip
        run: python -m unittest discover -s tests -p test_installer_package.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: ReviewHunter-installer
          path: dist/*
          if-no-files-found: error

  linux:
    name: ${{ matrix.image }} / ${{ matrix.method }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    needs: package
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:41"]
        method: [legacy, installer]
        scenario: [python]
        include:
          - {image: "ubuntu:24.04", method: installer, scenario: bare}
          - {image: "debian:12", method: installer, scenario: bare}
          - {image: "fedora:41", method: installer, scenario: bare}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReviewHunter-installer
          path: packaged

      - name: Baseline system (curl, and python3 for the "python" scenario)
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates procps >/dev/null
            if [ "${{ matrix.scenario }}" = python ]; then DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 >/dev/null; fi
          else
            dnf install -y -q curl procps-ng >/dev/null
            if [ "${{ matrix.scenario }}" = python ]; then dnf install -y -q python3 >/dev/null; fi
          fi

      - name: Install and start (${{ matrix.method }})
        id: run
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          ok=false
          if [ "${{ matrix.method }}" = legacy ]; then
            # Previous documented method: python3 run.py (bootstraps .venv, then serves on 8765)
            python3 run.py -- --no-browser --no-https > legacy.log 2>&1 &
            pid=$!
            for i in $(seq 1 600); do
              if curl -fsS http://127.0.0.1:8765/connector/ping >/dev/null 2>&1; then ok=true; break; fi
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            tail -20 legacy.log
            kill $pid 2>/dev/null
          else
            # Exercise the downloadable archive, including the bundled Chrome extension.
            if command -v apt-get >/dev/null; then
              apt-get install -y -qq unzip >/dev/null
            else
              dnf install -y -q unzip >/dev/null
            fi
            unzip -q packaged/ReviewHunter.zip -d packaged
            bash packaged/ReviewHunter/install.sh --cli --yes --no-launch && ok=true
            # the installer self-test already started the app; also check the files it promised
            test -f "$HOME/.local/share/reviewhunter/install.json" || ok=false
            test -f "$HOME/.local/share/applications/reviewhunter.desktop" || ok=false
            grep -q "doi_hunter_web.launcher" "$HOME/.local/share/applications/reviewhunter.desktop" || ok=false
            (cd "$HOME/.local/share/reviewhunter" && .venv/bin/python -c "import doi_hunter_web.server, doi_hunter_web.pdf_ingest, fontTools, curl_cffi") || ok=false
            test -f "$HOME/.local/share/reviewhunter/browser_extension/manifest.json" || ok=false
            test -f "$HOME/.local/share/reviewhunter/ChromeExtensionSetup.txt" || ok=false
          fi
          seconds=$(( $(date +%s) - start ))
          py=$(python3 -c 'import platform; print(platform.python_version())' 2>/dev/null || echo none)
          mkdir -p result
          printf '{"platform":"%s","scenario":"%s","method":"%s","success":%s,"seconds":%s,"python":"%s","run_id":"%s"}\n' \
            "${{ matrix.image }}" "${{ matrix.scenario }}" "${{ matrix.method }}" "$ok" "$seconds" "$py" "${{ github.run_id }}" \
            | tee result/result.json
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Uninstall keeps the library and removes the program
        if: matrix.method == 'installer' && steps.run.outputs.ok == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/ReviewHunter" && echo keep > "$HOME/ReviewHunter/marker.txt"
          # the program's own Python: a "bare" machine has no other one (it got a private Python from uv)
          "$HOME/.local/share/reviewhunter/.venv/bin/python" installer/reviewhunter_installer.py --uninstall --yes --target "$HOME/.local/share/reviewhunter"
          test ! -d "$HOME/.local/share/reviewhunter"
          test ! -f "$HOME/.local/share/applications/reviewhunter.desktop"
          test -f "$HOME/ReviewHunter/marker.txt"

      - name: Artifact name
        if: always()
        id: name
        shell: bash
        run: echo "v=result-$(echo '${{ matrix.image }}-${{ matrix.method }}-${{ matrix.scenario }}' | tr ':/' '--')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.v }}
          path: result/result.json
          if-no-files-found: ignore

      - name: Require successful installation
        # Legacy is a comparison baseline whose failures are recorded, not a release gate.
        if: always() && matrix.method == 'installer'
        shell: bash
        run: test '${{ steps.run.outputs.ok }}' = true

  linux-gui:
    name: Linux graphical installer screenshots
    runs-on: ubuntu-24.04
    needs: package
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReviewHunter-installer
          path: packaged
      - name: Virtual display, Tk and screenshot tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb python3-tk python3-venv imagemagick >/dev/null
      - name: Run the window with auto-start and capture it
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1100x800x24 & sleep 2
          python3 -m zipfile -e packaged/ReviewHunter.zip packaged
          RH_INSTALLER_AUTOSTART=1 python3 packaged/ReviewHunter/installer/reviewhunter_installer.py --target /tmp/rhgui --no-shortcuts --no-launch &
          sleep 12; import -window root gui-linux-progress.png
          for i in $(seq 1 300); do [ -f /tmp/rhgui/install.json ] && break; sleep 1; done
          sleep 3; import -window root gui-linux-done.png
          test -f /tmp/rhgui/install.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-linux-screenshots
          path: gui-linux-*.png

  windows:
    name: windows / ${{ matrix.method }}
    runs-on: windows-latest
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # installer = double-click Install-ReviewHunter.bat; oneline = install.ps1 (the "irm | iex" script)
        # forced onto the private-Python path (uv), as on a PC without Python.
        method: [legacy, installer, oneline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReviewHunter-installer
          path: packaged
      - name: Install and start (${{ matrix.method }})
        id: run
        shell: pwsh
        run: |
          $start = Get-Date; $ok = $false
          if ("${{ matrix.method }}" -eq "oneline") {
            Expand-Archive -LiteralPath packaged/ReviewHunter.zip -DestinationPath packaged
            $env:RH_FORCE_UV = "1"
            powershell -NoProfile -ExecutionPolicy Bypass -File packaged/ReviewHunter/install.ps1 --cli --yes --no-launch
            $target = "$env:LOCALAPPDATA\Programs\ReviewHunter"
            $ok = (Test-Path "$target\install.json") -and (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ReviewHunter.lnk")
          } elseif ("${{ matrix.method }}" -eq "legacy") {
            $p = Start-Process python -ArgumentList "run.py","--","--no-browser","--no-https" -WindowStyle Hidden -PassThru -RedirectStandardOutput legacy.log -RedirectStandardError legacy.err
            for ($i = 0; $i -lt 600; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/connector/ping -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {}
              if ($p.HasExited) { break }
              Start-Sleep 1
            }
            Get-Content legacy.err -Tail 20 -ErrorAction SilentlyContinue
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          } else {
            Expand-Archive -LiteralPath packaged/ReviewHunter.zip -DestinationPath packaged
            & "./packaged/ReviewHunter/Install-ReviewHunter.bat" --cli --yes --no-launch
            $rc = $LASTEXITCODE
            $target = "$env:LOCALAPPDATA\Programs\ReviewHunter"
            $ok = ($rc -eq 0) -and (Test-Path "$target\install.json") -and `
                  (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ReviewHunter.lnk") -and `
                  (Test-Path "$target\browser_extension\manifest.json") -and `
                  (Test-Path "$target\ChromeExtensionSetup.txt")
            if ($ok) {
              Push-Location $target
              try {
                & "$target\.venv\Scripts\python.exe" -c "import doi_hunter_web.pdf_ingest, fontTools, curl_cffi"
                $ok = $LASTEXITCODE -eq 0
              } finally { Pop-Location }
            }
          }
          if ($ok -and "${{ matrix.method }}" -ne "legacy") {
            # Open the Start menu shortcut itself (what a click does) and check WHICH instance answers.
            $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ReviewHunter.lnk"
            $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
            "shortcut: $($s.TargetPath) $($s.Arguments) in $($s.WorkingDirectory)"
            $ok = $s.TargetPath -like "*pythonw.exe" -and $s.Arguments -like "*doi_hunter_web.launcher*"
            $env:REVIEWHUNTER_NO_DIALOGS = "1"
            Start-Process $lnk
            $inst = $null
            for ($i = 0; $i -lt 120 -and -not $inst; $i++) {
              try { $inst = Invoke-RestMethod http://127.0.0.1:8765/api/system/instance -TimeoutSec 2 } catch { Start-Sleep 1 }
            }
            $inst | ConvertTo-Json
            $ok = $ok -and $inst -and ($inst.root -eq $target) -and ($inst.launched_by -eq "launcher")
            try { Invoke-RestMethod -Method Post http://127.0.0.1:8765/api/system/shutdown | Out-Null } catch { $ok = $false }
            Start-Sleep 3
          }
          $seconds = [int]((Get-Date) - $start).TotalSeconds
          $py = (python -c "import platform; print(platform.python_version())")
          New-Item -ItemType Directory -Force result | Out-Null
          $json = @{ platform = "windows-latest"; scenario = "python"; method = "${{ matrix.method }}"; success = $ok; seconds = $seconds; python = "$py"; run_id = "${{ github.run_id }}" } | ConvertTo-Json -Compress
          Set-Content -Path result/result.json -Value $json -Encoding utf8NoBOM
          $json
          "ok=$($ok.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Uninstall keeps the library and removes the program
        if: matrix.method == 'installer' && steps.run.outputs.ok == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:USERPROFILE\ReviewHunter" | Out-Null
          Set-Content "$env:USERPROFILE\ReviewHunter\marker.txt" keep
          python installer/reviewhunter_installer.py --uninstall --yes
          if (Test-Path "$env:LOCALAPPDATA\Programs\ReviewHunter") { throw "program folder still present" }
          if (-not (Test-Path "$env:USERPROFILE\ReviewHunter\marker.txt")) { throw "library was touched" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-windows-${{ matrix.method }}-python
          path: result/result.json
          if-no-files-found: ignore

      - name: Require successful installation
        if: always() && matrix.method != 'legacy'
        shell: pwsh
        run: |
          if ('${{ steps.run.outputs.ok }}' -ne 'true') { throw 'Installation or startup failed. See result artifact and logs.' }

  macos:
    # Real Macs (Apple silicon). "system" uses the runner's Python; "private" forces the path taken on a
    # Mac without Python: install.sh installs a private Python with uv (no admin, no Xcode tools).
    name: macos / ${{ matrix.python }}
    runs-on: macos-latest
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: [system, private]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ReviewHunter-installer
          path: packaged
      - name: Install from the release archive, then open the app like a user
        id: run
        shell: bash
        run: |
          set +e
          start=$(date +%s); ok=true
          ditto -x -k packaged/ReviewHunter.zip packaged          # Finder's unzip: keeps the executable bits
          test -x "packaged/ReviewHunter/Install ReviewHunter.command" || { echo "command file not executable"; ok=false; }
          if [ "${{ matrix.python }}" = private ]; then export RH_FORCE_UV=1; fi
          bash packaged/ReviewHunter/install.sh --cli --yes --no-launch || ok=false
          T="$HOME/Library/ReviewHunter"; APP="$HOME/Applications/ReviewHunter.app"
          test -f "$T/install.json" || { echo "no install.json"; ok=false; }
          test -x "$APP/Contents/MacOS/ReviewHunter" || { echo "no app bundle"; ok=false; }
          plutil -lint "$APP/Contents/Info.plist" || ok=false
          test -L "$HOME/Desktop/ReviewHunter.app" || echo "note: no Desktop link"
          export REVIEWHUNTER_NO_DIALOGS=1
          # 1) the bundle's executable = what Launchpad runs; the launcher starts the server and exits
          "$APP/Contents/MacOS/ReviewHunter" --no-browser || ok=false
          curl -fsS http://127.0.0.1:8765/api/system/instance | tee instance.json; echo
          grep -q "\"root\": *\"$T\"" instance.json || { echo "wrong instance"; ok=false; }
          # 2) clicking again: same instance (no second server)
          pid1=$(python3 -c "import json; print(json.load(open('instance.json'))['pid'])")
          "$APP/Contents/MacOS/ReviewHunter" --no-browser || ok=false
          pid2=$(curl -fsS http://127.0.0.1:8765/api/system/instance | python3 -c "import json,sys; print(json.load(sys.stdin)['pid'])")
          [ "$pid1" = "$pid2" ] || { echo "second click started another server"; ok=false; }
          curl -fsS -X POST http://127.0.0.1:8765/api/system/shutdown; echo; sleep 3
          # 3) through LaunchServices, exactly like a double-click in Finder
          open -a "$APP" --args --no-browser
          up=false
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8765/api/system/instance >/dev/null 2>&1 && { up=true; break; }; sleep 1; done
          if ! $up; then
            echo "open -a did not start the app"; ok=false
            echo "--- launcher.log"; cat "$HOME/ReviewHunter/logs/launcher.log" 2>/dev/null
            echo "--- server.log"; tail -20 "$HOME/ReviewHunter/logs/server.log"
            echo "--- processes"; ps -axo pid,ppid,command | grep -i -E "reviewhunter|doi_hunter" | grep -v grep
            echo "--- gatekeeper"; spctl --assess --type execute -vv "$APP" 2>&1; xattr -lr "$APP" 2>&1 | head
            echo "--- system log"; log show --last 3m --style compact --predicate 'eventMessage CONTAINS[c] "reviewhunter"' 2>/dev/null | tail -40
          fi
          curl -fsS -X POST http://127.0.0.1:8765/api/system/shutdown; echo; sleep 2
          seconds=$(( $(date +%s) - start ))
          mkdir -p result
          printf '{"platform":"macos-latest","scenario":"%s","method":"installer","success":%s,"seconds":%s,"python":"%s","run_id":"%s"}\n' \
            "${{ matrix.python }}" "$ok" "$seconds" "$("$T/.venv/bin/python" -c 'import platform; print(platform.python_version())' 2>/dev/null || echo none)" "${{ github.run_id }}" \
            | tee result/result.json
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Launcher and shortcut tests on macOS (TIME_WAIT, stale instances, real .app bundle)
        if: always() && matrix.python == 'system'
        shell: bash
        run: |
          PY="$HOME/Library/ReviewHunter/.venv/bin/python"
          "$PY" -m pip install -q pytest
          "$PY" -m pytest tests/test_launcher.py tests/test_shortcuts.py -q -p no:cacheprovider

      - name: Uninstall keeps the library and removes the program and the app
        if: steps.run.outputs.ok == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/ReviewHunter" && echo keep > "$HOME/ReviewHunter/marker.txt"
          "$HOME/Library/ReviewHunter/.venv/bin/python" installer/reviewhunter_installer.py --uninstall --yes --target "$HOME/Library/ReviewHunter"
          test ! -d "$HOME/Library/ReviewHunter"
          test ! -e "$HOME/Applications/ReviewHunter.app"
          test ! -L "$HOME/Desktop/ReviewHunter.app"
          test -f "$HOME/ReviewHunter/marker.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-macos-installer-${{ matrix.python }}
          path: result/result.json
          if-no-files-found: ignore

      - name: Require successful installation
        if: always()
        shell: bash
        run: test '${{ steps.run.outputs.ok }}' = true
