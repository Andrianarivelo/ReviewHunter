# Browser connectors for Firefox and Safari, built from the one source in browser_extension/.
#
#   firefox  builds the add-on and runs tools/extension_firefox_e2e.py in a real Firefox (native
#            messaging start, same-window open, popup auto-start), then uploads the unsigned .xpi
#   sign     (only when the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets exist) has Mozilla sign it, so
#            release Firefox installs it permanently with one click
#   safari   wraps the web extension in a macOS app with Apple's converter and xcodebuild (ad-hoc
#            signature: Safari needs "Allow Unsigned Extensions" until it is signed with a Developer ID)
#   release  attaches ReviewHunter-Firefox.xpi and ReviewHunter-Safari.zip to a published release;
#            "ReviewHunter for Firefox / Safari" download them from the latest release
name: connectors

on:
  push:
    branches: [main]
    paths: ["browser_extension/**", "tools/build_extensions.py", "tools/extension_firefox_e2e.py",
            "tools/sign_firefox.py", "doi_hunter_web/native_host.py", "doi_hunter_web/launcher.py",
            ".github/workflows/connectors.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    name: Firefox connector (real Firefox e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ReviewHunter and Selenium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt selenium
      - name: Build the Firefox and Safari web extensions
        run: python tools/build_extensions.py --out dist/connectors
      - name: End-to-end in Firefox (headless)
        run: python tools/extension_firefox_e2e.py --firefox "$(command -v firefox)" --geckodriver "$(command -v geckodriver)"
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-connector
          path: dist/connectors/ReviewHunter-Firefox.xpi
          if-no-files-found: error

  sign:
    name: Mozilla signature (needs AMO API key secrets)
    runs-on: ubuntu-latest
    needs: firefox
    if: github.event_name != 'push'
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: firefox-connector
          path: dist/connectors
      - name: Sign with addons.mozilla.org (unlisted, not published in the store)
        if: env.AMO_JWT_ISSUER != ''
        run: |
          python -m pip install requests
          python tools/sign_firefox.py dist/connectors/ReviewHunter-Firefox.xpi
          mv dist/connectors/ReviewHunter-Firefox-signed.xpi dist/connectors/ReviewHunter-Firefox.xpi
      - name: No AMO key configured
        if: env.AMO_JWT_ISSUER == ''
        run: echo "::notice::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set; the release keeps the unsigned .xpi (temporary install only)."
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-connector-release
          path: dist/connectors/ReviewHunter-Firefox.xpi

  safari:
    name: Safari connector (macOS app)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Safari web extension
        run: python3 tools/build_extensions.py --out dist/connectors
      - name: Convert to a Safari app extension project
        run: |
          xcrun safari-web-extension-converter dist/connectors/safari \
            --project-location build/safari --app-name "ReviewHunter Connector" \
            --bundle-identifier org.reviewhunter.connector --swift --macos-only --copy-resources \
            --no-open --no-prompt --force
      - name: Build (ad-hoc signature)
        run: |
          set -o pipefail
          project="$(find build/safari -name '*.xcodeproj' -maxdepth 3 | head -1)"
          echo "project: $project"
          # The converter derives the app ID from its name but the extension ID from --bundle-identifier.
          python3 tools/build_extensions.py --align-xcode "$project/project.pbxproj"
          xcodebuild -project "$project" -alltargets -configuration Release SYMROOT="$PWD/build/sym" \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" CODE_SIGNING_REQUIRED=NO \
            ENABLE_HARDENED_RUNTIME=NO 2>&1 | tail -n 40
      - name: Check and package the app
        run: |
          app="$(find build/sym/Release -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app"
          appex="$(find "$app/Contents/PlugIns" -name '*.appex' | head -1)"
          test -f "$appex/Contents/Resources/manifest.json"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "org.reviewhunter.connector"
          test "$(plutil -extract CFBundleIdentifier raw "$appex/Contents/Info.plist")" = "org.reviewhunter.connector.Extension"
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); assert 'nativeMessaging' not in m['permissions']; print('manifest', m['version'])" "$appex/Contents/Resources/manifest.json"
          codesign --verify --deep --verbose=2 "$app"
          mkdir -p dist/release
          ditto -c -k --keepParent "$app" dist/release/ReviewHunter-Safari.zip
          ls -la dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: safari-connector
          path: dist/release/ReviewHunter-Safari.zip
          if-no-files-found: error

  release:
    name: Attach connectors to the release
    runs-on: ubuntu-latest
    needs: [sign, safari]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firefox-connector-release
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: safari-connector
          path: out
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/ReviewHunter-Firefox.xpi out/ReviewHunter-Safari.zip --clobber --repo "${{ github.repository }}"
